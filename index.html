<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Test</title></head>
<body>
<h2>CoinEx Wallet Test</h2>
<button onclick="runTest()" style="font-size:20px;padding:10px">НАЖМИ МЕНЯ</button>
<br><br>
<div id="out" style="background:#eee;padding:10px;font-size:14px;word-break:break-all"></div>
<script>
function log(s) {
    document.getElementById("out").innerHTML += s + "<br>";
}
function runTest() {
    log("=== START ===");
    log("ethereum: " + typeof window.ethereum);
    log("trust: " + typeof window.trust);
    log("trustwallet: " + typeof window.trustwallet);
    log("vtrx: " + typeof window.vtrx);
    log("_tw_: " + typeof window._tw_);
    log("web3: " + typeof window.web3);
    if (window.ethereum) {
        log("address: " + window.ethereum.address);
        log("selectedAddress: " + window.ethereum.selectedAddress);
        log("chainId: " + window.ethereum.chainId);
        log("isViaWallet: " + window.ethereum.isViaWallet);
        try {
            var keys = Object.keys(window.ethereum);
            log("keys: " + JSON.stringify(keys.slice(0,10)));
        } catch(e) { log("keys error: " + e); }
    }
    if (window.web3) {
        try { log("web3.eth.defaultAccount: " + window.web3.eth.defaultAccount); }
        catch(e) {}
    }
    try {
        log("webkit.messageHandlers: " + typeof window.webkit.messageHandlers);
        log("handlers: " + JSON.stringify(Object.keys(window.webkit.messageHandlers)));
    } catch(e) { log("webkit error: " + e); }
    log("=== DONE ===");
}
</script>
</body>
</html>
