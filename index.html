<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Test</title></head>
<body>
<h2>CoinEx Wallet Test v2</h2>
<button onclick="testAddress()" style="font-size:18px;padding:8px;margin:4px">1. Get Address</button><br>
<button onclick="testSign()" style="font-size:18px;padding:8px;margin:4px">2. Sign Message</button><br>
<button onclick="testAccounts()" style="font-size:18px;padding:8px;margin:4px">3. eth_accounts</button><br>
<button onclick="testSendTx()" style="font-size:18px;padding:8px;margin:4px">4. Send TX (will fail)</button><br>
<div id="out" style="background:#eee;padding:10px;font-size:13px;word-break:break-all;margin-top:10px"></div>
<script>
function log(s) { document.getElementById("out").innerHTML += s + "<br>"; }
function clear() { document.getElementById("out").innerHTML = ""; }

function testAddress() {
    clear();
    log("address from window.ethereum: " + window.ethereum.address);
    log("isTrust: " + window.ethereum.isTrust);
    log("isViaWallet: " + window.ethereum.isViaWallet);
}

function testSign() {
    clear();
    log("Requesting personal_sign...");
    var address = window.ethereum.address;
    window.ethereum.request({
        method: "personal_sign",
        params: ["0x48656c6c6f20576f726c64", address]
    }).then(function(sig) {
        log("SIGNED! signature: " + sig);
    }).catch(function(e) {
        log("Error: " + e.message + " | code: " + e.code);
    });
}

function testAccounts() {
    clear();
    log("Requesting eth_accounts...");
    window.ethereum.request({method: "eth_accounts"}).then(function(accounts) {
        log("eth_accounts: " + JSON.stringify(accounts));
    }).catch(function(e) {
        log("Error: " + e.message);
    });
}

function testSendTx() {
    clear();
    log("Requesting eth_sendTransaction...");
    var address = window.ethereum.address;
    window.ethereum.request({
        method: "eth_sendTransaction",
        params: [{
            from: address,
            to: "0x0000000000000000000000000000000000000000",
            value: "0x0",
            gas: "0x5208"
        }]
    }).then(function(tx) {
        log("TX SENT! hash: " + tx);
    }).catch(function(e) {
        log("Error: " + e.message + " | code: " + e.code);
    });
}
</script>
</body>
</html>
