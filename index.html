<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>CoinEx Wallet Address Test</title></head>
<body>
<h2>Wallet Address Test</h2>
<pre id="out" style="background:#f0f0f0;padding:10px;word-break:break-all"></pre>
<script>
var out = document.getElementById("out");
function log(s) { out.textContent += s + "
"; }

// Тест 1: адрес уже в window.ethereum
window.addEventListener("load", function() {
    setTimeout(function() {
        try {
            log("window.ethereum exists: " + (typeof window.ethereum));
            if (window.ethereum) {
                log("ethereum.address: " + window.ethereum.address);
                log("ethereum.selectedAddress: " + window.ethereum.selectedAddress);
                log("ethereum.chainId: " + window.ethereum.chainId);
                log("ethereum.isViaWallet: " + window.ethereum.isViaWallet);
                log("ethereum.isTrust: " + window.ethereum.isTrust);
            }
            log("window.trustwallet: " + (typeof window.trustwallet));
            log("window.trust: " + (typeof window.trust));
            log("window.vtrx: " + (typeof window.vtrx));
        } catch(e) { log("ERROR: " + e.message); }
    }, 500);
    
    // Тест 2: eth_accounts без запроса
    setTimeout(function() {
        if (window.ethereum) {
            window.ethereum.request({method: "eth_accounts"}).then(function(accounts) {
                log("eth_accounts response: " + JSON.stringify(accounts));
            }).catch(function(e) { log("eth_accounts error: " + e.message); });
        }
    }, 1000);
    
    // Тест 3: слушаем phantomRpcMessage (на случай если это Phantom-подобная архитектура)
    window.addEventListener("message", function(e) {
        log("window.message: " + JSON.stringify(e.data));
    });
});
</script>
</body>
</html>
