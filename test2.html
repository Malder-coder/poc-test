<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Test2</title></head>
<body>
<h2>Test - NEW PAGE</h2>
<p>Когда появится запрос подключения - нажми ОТМЕНА/CANCEL</p>
<button onclick="runTest()" style="font-size:18px;padding:10px;margin-top:10px">Проверить адрес</button>
<div id="out" style="background:#eee;padding:10px;font-size:13px;word-break:break-all;margin-top:10px"></div>
<script>
function log(s) { document.getElementById("out").innerHTML += s + "<br>"; }
function runTest() {
    log("ethereum: " + typeof window.ethereum);
    if (window.ethereum) {
        log("address: " + window.ethereum.address);
        log("selectedAddress: " + window.ethereum.selectedAddress);
        log("chainId: " + window.ethereum.chainId);
    } else {
        log("window.ethereum не существует");
    }
    log("trust: " + typeof window.trust);
}
</script>
</body>
</html>
