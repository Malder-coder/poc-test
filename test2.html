<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Test3</title></head>
<body>
<h2>Test</h2>
<button id="btn" style="font-size:20px;padding:12px">НАЖМИ МЕНЯ</button>
<div id="out" style="background:#eee;padding:10px;font-size:13px;margin-top:10px"></div>
<script>
document.getElementById("btn").onclick = function() {
    var r = [];
    r.push("trust: " + typeof window.trust);
    r.push("_tw_: " + typeof window._tw_);
    r.push("ethereum: " + typeof window.ethereum);
    
    if (window.trust) {
        try { r.push("trust keys: " + JSON.stringify(Object.getOwnPropertyNames(window.trust))); } catch(e) { r.push("trust keys error: " + e); }
    }
    if (window._tw_) {
        try { r.push("_tw_ keys: " + JSON.stringify(Object.getOwnPropertyNames(window._tw_))); } catch(e) { r.push("_tw_ error: " + e); }
    }
    if (window.ethereum) {
        try { r.push("eth address: " + window.ethereum.address); } catch(e) {}
        try { r.push("eth chainId: " + window.ethereum.chainId); } catch(e) {}
        try {
            var proto = Object.getPrototypeOf(window.ethereum);
            var methods = Object.getOwnPropertyNames(proto).filter(function(k){ return typeof proto[k]==="function"; });
            r.push("eth methods: " + JSON.stringify(methods));
        } catch(e) { r.push("eth methods error: " + e); }
    }
    r.push("userAgent: " + navigator.userAgent);
    r.push("cookies: " + (document.cookie || "empty"));
    
    document.getElementById("out").innerHTML = r.join("<br>");
};
</script>
</body>
</html>
